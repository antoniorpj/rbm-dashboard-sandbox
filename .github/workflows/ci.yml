name: CI

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  verify:
    name: Lint, contract and build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Format check (Biome)
        run: npm run format:check

      - name: Contract check
        run: npm run check:contract

      - name: Build (offline, bundled sample data)
        run: npm run build
        env:
          UNITAID_NOTIFICATIONS_TOKEN: ci-token
